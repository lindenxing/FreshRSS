# fly.toml app configuration file generated for lindenrss on 2026-01-04T21:56:23+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lindenrss'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[experimental]
  auto_rollback = true

[build]
  dockerfile = '/Docker/Dockerfile'

[env]
  CRON_MIN = '*/20'
  FRESHRSS_THEME = 'Mapco'
  TZ = 'Asia/Shanghai'
  FRESHRSS_DB_TYPE = 'mysql'
  FRESHRSS_DB_HOST = 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000'
  FRESHRSS_DB_USER = '3u2vuFJJFcXRTqU.root'
  FRESHRSS_DB_BASE = 'freshrss'  # 或者你创建的数据库名
  FRESHRSS_DB_MYSQL_SSL_ENABLE = "true"
  FRESHRSS_DB_MYSQL_SSL_VERIFY = "true"
  FRESHRSS_DB_MYSQL_SSL_CA = "/etc/ssl/certs/ca-certificates.crt"
  FRESHRSS_INSTALL_FORCE_DB_CONFIG = "true"

[[mounts]]
  source = 'freshrss_data'
  destination = '/var/www/FreshRSS/data'
  initial_size = '1gb'

[[services]]
  protocol = 'tcp'
  internal_port = 80
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
